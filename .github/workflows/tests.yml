name: phpBB Extension Validation & CI

on: [push, pull_request]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Syntax Lint
        run: find . -name "*.php" -exec php -l {} \;

  epv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install phpBB EPV
        run: composer create-project phpbb/epv:dev-master --no-interaction --prefer-source
      - name: Run EPV
        run: php epv/bin/epv.php run .
